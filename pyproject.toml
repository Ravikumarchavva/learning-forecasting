[project]
name = "learning-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ravikumarchavva", email = "ravikumarchavva@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.0",
    "mlforecast>=1.0.2",
    "pandas>=3.0.3",
    "statsforecast>=2.0.2",
    "tqdm>=4.68.3",
    "utilsforecast>=0.2.15",
    "window-ops>=0.0.15",
]

[project.scripts]
learning-forecasting = "learning_forecasting:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
